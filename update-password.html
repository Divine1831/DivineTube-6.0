<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password | DivineTube</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
</head>
<body>
  <main class="page">
    <div class="authWrap">
      <div class="authCard">
        <div class="brand">▶ Divine<span>Tube</span></div>
        <h1>Reset your password</h1>
        <p class="muted">Enter your new DivineTube password below.</p>

        <form id="resetForm">
          <label for="password">New password</label>
          <input id="password" type="password" minlength="6"
            autocomplete="new-password" placeholder="Enter new password" required>

          <label for="confirmPassword">Confirm new password</label>
          <input id="confirmPassword" type="password" minlength="6"
            autocomplete="new-password" placeholder="Enter password again" required>

          <button class="btn primary" id="submitBtn"
            type="submit" style="width:100%;margin-top:20px">
            Update password
          </button>
        </form>

        <p id="msg" class="notice" role="status" aria-live="polite"
          style="margin-top:15px">Checking your recovery link...</p>

        <a href="auth.html">Back to sign in</a>
      </div>
    </div>
  </main>

  <script>
    (() => {
      const msg = document.getElementById('msg');
      const form = document.getElementById('resetForm');
      const btn = document.getElementById('submitBtn');
      const passwordInput = document.getElementById('password');
      const confirmInput = document.getElementById('confirmPassword');

      let client = null;
      let ready = false;
      let busy = false;

      function showMessage(text) {
        msg.textContent = text;
      }

      async function setup() {
        const cfg = window.DIVINETUBE_CONFIG;
        if (!cfg || !window.supabase) {
          throw new Error('Supabase could not load. Refresh the page and try again.');
        }

        const key = cfg.SUPABASE_ANON_KEY ||
          cfg.SUPABASE_PUBLISHABLE_KEY || cfg.SUPABASE_KEY;

        if (!cfg.SUPABASE_URL || !key) {
          throw new Error('Supabase URL or public key is missing in js/config.js.');
        }

        client = window.supabase.createClient(cfg.SUPABASE_URL, key);

        // Handle a recovery link that returns tokens in the URL fragment.
        const hash = new URLSearchParams(location.hash.slice(1));
        const access = hash.get('access_token');
        const refresh = hash.get('refresh_token');
        const type = hash.get('type');

        if (type === 'recovery' && access && refresh) {
          const { error } = await client.auth.setSession({
            access_token: access,
            refresh_token: refresh
          });
          if (error) throw error;

          // Remove sensitive tokens from the visible URL after establishing session.
          history.replaceState(null, '', location.pathname + location.search);
        }

        const { data, error } = await client.auth.getSession();
        if (error) throw error;

        if (!data.session) {
          throw new Error('No recovery session found. Request a fresh password-reset email and open its link.');
        }

        ready = true;
        btn.disabled = false;
        showMessage('Recovery verified. Enter and confirm your new password.');
      }

      btn.disabled = true;

      setup().catch(error => {
        ready = false;
        btn.disabled = true;
        showMessage(error.message || 'Could not verify the recovery link.');
      });

      form.addEventListener('submit', async event => {
        event.preventDefault();

        if (busy) return;

        if (!ready || !client) {
          showMessage('Your recovery link has not been verified. Request a fresh reset email.');
          return;
        }

        const password = passwordInput.value;
        const confirm = confirmInput.value;

        if (password.length < 6) {
          showMessage('Your password must be at least 6 characters.');
          return;
        }

        if (password !== confirm) {
          showMessage('The passwords do not match.');
          return;
        }

        busy = true;
        btn.disabled = true;
        btn.textContent = 'Updating password...';
        showMessage('Updating your password...');

        try {
          const { data, error } = await client.auth.updateUser({ password });
          if (error) throw error;
          if (!data.user) throw new Error('Supabase did not confirm the account update.');

          showMessage('Password updated successfully! Redirecting to sign in...');
          form.reset();

          // Sign out the recovery session before normal login.
          await client.auth.signOut();

          setTimeout(() => {
            location.href = 'auth.html';
          }, 1800);
        } catch (error) {
          showMessage(error.message || 'Password update failed. Request a fresh reset link.');
        } finally {
          busy = false;
          btn.disabled = !ready;
          btn.textContent = 'Update password';
        }
      });
    })();
  </script>
</body>
</html>
