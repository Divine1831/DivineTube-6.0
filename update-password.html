
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password | DivineTube</title>

  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
</head>
<body>
  <main class="page">
    <div class="authWrap">
      <div class="authCard">
        <div class="brand">▶ Divine<span>Tube</span></div>

        <h1>Reset your password</h1>
        <p class="muted">Enter your new DivineTube password below.</p>

        <form id="resetForm">
          <label for="password">New password</label>
          <input id="password" type="password"
            minlength="6" autocomplete="new-password"
            placeholder="Enter new password" required>

          <label for="confirmPassword">Confirm new password</label>
          <input id="confirmPassword" type="password"
            minlength="6" autocomplete="new-password"
            placeholder="Enter password again" required>

          <button class="btn primary" id="submitBtn"
            type="submit" style="width:100%;margin-top:20px">
            Update password
          </button>
        </form>

        <p id="msg" class="notice" role="status"
          aria-live="polite" style="margin-top:15px"></p>

        <a href="auth.html">Back to sign in</a>
      </div>
    </div>
  </main>

  <script>
    const msg = document.getElementById('msg');
    const form = document.getElementById('resetForm');
    const btn = document.getElementById('submitBtn');

    async function setup() {
      const cfg = window.DIVINETUBE_CONFIG;

      if (!cfg || !window.supabase) {
        throw new Error('Supabase configuration could not be loaded.');
      }

      const key = cfg.SUPABASE_ANON_KEY ||
                  cfg.SUPABASE_PUBLISHABLE_KEY ||
                  cfg.SUPABASE_KEY;

      if (!cfg.SUPABASE_URL || !key) {
        throw new Error('Check the Supabase URL and public key in js/config.js.');
      }

      const sb = window.supabase.createClient(cfg.SUPABASE_URL, key);
      const hash = new URLSearchParams(location.hash.slice(1));
      const type = hash.get('type');
      const access = hash.get('access_token');
      const refresh = hash.get('refresh_token');

      if (type === 'recovery' && access && refresh) {
        const { error } = await sb.auth.setSession({
          access_token: access,
          refresh_token: refresh
        });
        if (error) throw error;
      }

      const { data, error } = await sb.auth.getSession();
      if (error) throw error;

      if (!data.session) {
        throw new Error('Recovery link is invalid or expired. Request a new password-reset email.');
      }

      return sb;
    }

    const clientReady = setup().catch(error => {
      msg.textContent = error.message;
      btn.disabled = true;
      return null;
    });

    form.addEventListener('submit', async event => {
      event.preventDefault();
      msg.textContent = '';

      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirmPassword').value;

      if (password.length < 6) {
        msg.textContent = 'Password must be at least 6 characters.';
        return;
      }

      if (password !== confirm) {
        msg.textContent = 'The passwords do not match.';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Updating...';

      try {
        const sb = await clientReady;
        if (!sb) return;

        const { error } = await sb.auth.updateUser({ password });
        if (error) throw error;

        msg.textContent = 'Password updated successfully! Redirecting to sign in...';
        form.reset();

        setTimeout(() => {
          location.href = 'auth.html';
        }, 2000);
      } catch (error) {
        msg.textContent = error.message || 'Password update failed. Request a new reset link.';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Update password';
      }
    });
  </script>
</body>
</html>
