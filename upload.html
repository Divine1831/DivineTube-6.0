<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Upload | DivineTube</title><link rel="stylesheet" href="css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/layout.js" defer></script><script src="js/app.js" defer></script></head><body><div id="app"></div><main class="page"><div class="formPage"><h1>Upload a video</h1><div id="uploadGate"></div><form id="uploadForm" class="formCard"><label>Title<input id="title" maxlength="120" required></label><label>Description<textarea id="desc" rows="6"></textarea></label><label>Category<select id="category"><option>General</option><option>Music</option><option>Gaming</option><option>Education</option><option>Tech</option><option>Sports</option><option>Comedy</option></select></label><label>Video<input id="video" type="file" accept="video/*" required></label><label>Thumbnail<input id="thumb" type="file" accept="image/*"></label><img id="preview" class="preview hidden"><p id="msg" class="notice"></p><button class="btn primary">Publish</button></form></div></main><div id="toast" class="toast"></div></body></html>
