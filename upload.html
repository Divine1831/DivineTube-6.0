<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upload | DivineTube</title>

<link rel="stylesheet" href="css/style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/layout.js" defer></script>
<script src="js/app.js" defer></script>
</head>

<body>

<div id="app"></div>

<main class="page">
  <div class="formPage">

    <h1>Upload a video</h1>

    <div id="uploadGate"></div>

    <form id="uploadForm" class="formCard">

      <label>
        Title
        <input
          id="title"
          maxlength="120"
          required
          placeholder="Enter your video title"
        >
      </label>

      <label>
        Description
        <textarea
          id="desc"
          rows="6"
          placeholder="Tell viewers about your video"
        ></textarea>
      </label>

      <label>
        Category
        <select id="category">
          <option>General</option>
          <option>Music</option>
          <option>Gaming</option>
          <option>Education</option>
          <option>Tech</option>
          <option>Sports</option>
          <option>Comedy</option>
        </select>
      </label>

      <label>
        Video file
        <input
          id="video"
          type="file"
          accept="video/*"
        >
      </label>

      <p style="text-align:center;color:#929aaa;margin:14px 0;font-weight:600;">
        OR
      </p>

      <label>
        Video URL
        <input
          id="videoUrl"
          type="url"
          placeholder="Paste a direct video file URL"
        >
      </label>

      <p class="muted" style="margin-top:-6px;margin-bottom:14px;">
        Use a direct video-file URL that you have permission to use.
      </p>

      <label>
        Thumbnail
        <input
          id="thumb"
          type="file"
          accept="image/*"
        >
      </label>

      <img
        id="preview"
        class="preview hidden"
        alt="Thumbnail preview"
      >

      <p id="msg" class="notice"></p>

      <button
        type="submit"
        class="btn primary"
      >
        Publish
      </button>

    </form>

  </div>
</main>

<div id="toast" class="toast"></div>

</body>
</html>
