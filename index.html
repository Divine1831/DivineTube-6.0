<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b0f19">
  <meta name="description" content="Watch videos, discover Shorts, and explore creators on DivineTube 6.0.">

  <title>Home | DivineTube 6.0</title>

  <!-- PWA setup -->
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">

  <!-- Google AdSense verification / ad script -->
  <script async
    src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7988422470370148"
    crossorigin="anonymous"></script>

  <!-- Existing styles and scripts -->
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/layout.js" defer></script>
  <script src="js/app.js" defer></script>
  <script src="/js/pwa.js" defer></script>
</head>

<body>
  <div id="app"></div>

  <main class="page">
    <section class="hero">
      <div>
        <span class="eyebrow">DIVINETUBE 6.0</span>

        <h1>Watch. Create. Share.</h1>
        <p>Your creator-first video platform.</p>

        <div class="heroActions">
          <a class="btn primary" href="upload.html">
            Create a video
          </a>

          <a class="btn" href="trending.html">
            Explore trending
          </a>
        </div>
      </div>

      <div class="heroOrb" aria-hidden="true">▶</div>
    </section>

    <div class="sectionHead">
      <h2>Explore</h2>
    </div>

    <div class="chips">
      <button class="chip active" data-category="">All</button>
      <button class="chip" data-category="Music">Music</button>
      <button class="chip" data-category="Gaming">Gaming</button>
      <button class="chip" data-category="Education">Education</button>
      <button class="chip" data-category="Tech">Tech</button>
      <button class="chip" data-category="Sports">Sports</button>
      <button class="chip" data-category="Comedy">Comedy</button>
    </div>

    <div class="sectionHead">
      <h2>Recommended</h2>
    </div>

    <div id="videoGrid" class="videoGrid"></div>
  </main>

  <div id="toast" class="toast"></div>
</body>
</html>
